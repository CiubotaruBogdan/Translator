<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Istoric Traduceri (CMD) - Traducator Offline</title>
<style>
  :root {
    --bg: #f8f9fa; --bg2: #ffffff; --text: #1a1a2e; --text2: #495057;
    --text3: #868e96; --border: #dee2e6; --primary: #4361ee;
    --green: #2ecc71; --red: #e74c3c; --amber: #f39c12; --blue: #3498db;
    --code-bg: #0f1021; --code-text: #d4d4d4;
  }
  [data-theme="dark"] {
    --bg: #0f0f1a; --bg2: #1a1a2e; --text: #e0e0e0; --text2: #b0b0b0;
    --text3: #707070; --border: #2a2a3e; --code-bg: #07070f; --code-text: #c8c8d8;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: var(--bg); color: var(--text); padding: 20px; max-width: 1200px; margin: 0 auto; }
  h1 { font-size: 24px; margin-bottom: 20px; }
  .card { background: var(--bg2); border: 1px solid var(--border); border-radius: 8px; margin-bottom: 16px; }
  .card-header { display: flex; justify-content: space-between; align-items: center; padding: 12px 16px; border-bottom: 1px solid var(--border); flex-wrap: wrap; gap: 8px; }
  .card-title { font-weight: 600; font-size: 14px; }
  .btn { display: inline-flex; align-items: center; gap: 6px; padding: 8px 16px; border: none; border-radius: 6px; font-size: 13px; cursor: pointer; font-weight: 500; }
  .btn-secondary { background: var(--bg); border: 1px solid var(--border); color: var(--text); }
  .btn-secondary:hover { background: var(--border); }
  .btn-danger { background: var(--red); color: white; }
  .btn-danger:hover { opacity: 0.9; }
  .btn-sm { padding: 4px 10px; font-size: 12px; }
  .form-control { padding: 6px 10px; border: 1px solid var(--border); border-radius: 4px; font-size: 13px; background: var(--bg2); color: var(--text); }
  .toolbar { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 16px; align-items: center; }
  .toolbar-right { margin-left: auto; }
  .auto-refresh { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--text2); }
  .theme-toggle { cursor: pointer; background: none; border: 1px solid var(--border); border-radius: 6px; padding: 6px 10px; color: var(--text); font-size: 12px; }

  .ex { border: 1px solid var(--border); border-radius: 8px; margin-bottom: 10px; overflow: hidden; }
  .ex-head { display: flex; align-items: center; gap: 10px; padding: 10px 14px; cursor: pointer; font-size: 13px; }
  .ex-head:hover { background: var(--bg); }
  .ex-head .arrow { transition: transform .15s; color: var(--text3); }
  .ex.open .arrow { transform: rotate(90deg); }
  .badge { font-size: 11px; font-weight: 600; padding: 2px 8px; border-radius: 10px; white-space: nowrap; }
  .badge.ollama { background: #dcfce7; color: #166534; }
  .badge.libretranslate { background: #e0f2fe; color: #075985; }
  .badge.kind { background: var(--bg); color: var(--text2); border: 1px solid var(--border); }
  .badge.err { background: #fee2e2; color: #991b1b; }
  .ex-meta { color: var(--text3); font-size: 12px; }
  .ex-langs { font-weight: 600; color: var(--text2); }
  .ex-time { color: var(--text3); font-size: 12px; min-width: 150px; }
  .ex-spacer { flex: 1; }
  .ex-body { display: none; border-top: 1px solid var(--border); padding: 12px 14px; }
  .ex.open .ex-body { display: block; }
  .io-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  @media (max-width: 800px) { .io-grid { grid-template-columns: 1fr; } }
  .io-label { font-size: 11px; text-transform: uppercase; font-weight: 600; color: var(--text3); margin-bottom: 4px; display: flex; justify-content: space-between; align-items: center; }
  pre.io { background: var(--code-bg); color: var(--code-text); padding: 10px; border-radius: 6px; font-family: 'Consolas','Courier New',monospace; font-size: 12px; white-space: pre-wrap; word-break: break-word; max-height: 360px; overflow-y: auto; }
  .copy-btn { background: none; border: 1px solid var(--border); color: var(--text3); border-radius: 4px; font-size: 11px; padding: 1px 6px; cursor: pointer; }
  .copy-btn:hover { color: var(--text); }
  .empty { padding: 30px; text-align: center; color: var(--text3); font-size: 13px; }
</style>
</head>
<body>

<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px">
  <h1>Istoric Traduceri (CMD)</h1>
  <div style="display:flex;gap:8px;align-items:center">
    <label class="auto-refresh"><input type="checkbox" id="autoRefresh"> Auto-refresh (5s)</label>
    <button class="theme-toggle" onclick="toggleTheme()">Schimba tema</button>
    <a href="/" style="font-size:13px;color:var(--primary);text-decoration:none">&larr; Inapoi la aplicatie</a>
  </div>
</div>
<p style="color:var(--text3);font-size:13px;margin-bottom:16px">
  Fiecare intrare arata <strong>promptul exact trimis</strong> catre motor si <strong>raspunsul brut primit</strong>.
</p>

<div class="toolbar">
  <input class="form-control" id="filterJob" placeholder="Filtru job_id (ex: a1b2c3d4 sau text)" style="width:auto" oninput="debouncedLoad()">
  <select class="form-control" id="filterEngine" onchange="loadPrompts()" style="width:auto">
    <option value="">Toate motoarele</option>
    <option value="ollama">Ollama</option>
    <option value="libretranslate">LibreTranslate</option>
  </select>
  <select class="form-control" id="filterLimit" onchange="loadPrompts()" style="width:auto">
    <option value="100">Ultimele 100</option>
    <option value="200" selected>Ultimele 200</option>
    <option value="500">Ultimele 500</option>
    <option value="1000">Ultimele 1000</option>
  </select>
  <button class="btn btn-secondary" onclick="loadPrompts()">Reincarca</button>
  <span id="countLabel" style="font-size:12px;color:var(--text3)">0 intrari</span>
  <button class="btn btn-danger toolbar-right" onclick="clearPrompts()">Goleste istoricul</button>
</div>

<div class="card">
  <div class="card-body" id="list" style="padding:12px">
    <div class="empty">Se incarca...</div>
  </div>
</div>

<script src="/static/common.js"></script>
<script>
const $ = id => document.getElementById(id);

function escHtml(s) {
  const d = document.createElement('div');
  d.textContent = s == null ? '' : s;
  return d.innerHTML;
}

const expandedExchanges = new Set();
let promptsRequestId = 0;

async function copyText(btn, text) {
  const old = btn.textContent;
  try {
    await copyPlainText(text);
    btn.textContent = 'Copiat!';
  } catch (e) {
    btn.textContent = 'Copiere eșuată';
    btn.title = e.message;
  }
  setTimeout(() => { btn.textContent = old; }, 1200);
}

async function loadPrompts() {
  const requestId = ++promptsRequestId;
  try {
    const job = $('filterJob').value.trim();
    const engine = $('filterEngine').value;
    const limit = $('filterLimit').value;
    const params = new URLSearchParams({ limit });
    if (job) params.set('job_id', job);
    if (engine) params.set('engine', engine);
    const resp = await fetch('/api/prompts?' + params.toString());
    const data = await resp.json();
    if (!resp.ok) throw new Error(data.detail || resp.status);
    if (requestId !== promptsRequestId) return;
    const list = $('list');
    const scrollPositions = new Map([...list.querySelectorAll('.ex')].map(el =>
      [el.dataset.exchangeId, [...el.querySelectorAll('pre')].map(pre => pre.scrollTop)]));
    $('countLabel').textContent = data.prompts.length + ' / ' + data.total + ' intrari';

    if (!data.prompts.length) {
      list.innerHTML = '<div class="empty">Niciun schimb inregistrat inca. Ruleaza o traducere si revino aici.</div>';
      return;
    }

    list.innerHTML = data.prompts.map(p => {
      const engClass = p.engine === 'libretranslate' ? 'libretranslate' : 'ollama';
      const errBadge = p.error ? '<span class="badge err">EROARE</span>' : '';
      const retry = p.attempts > 1 ? `<span class="ex-meta">&#8635; ${escHtml(p.attempts)} incercari</span>` : '';
      const responseBlock = p.error
        ? `<pre class="io" style="color:var(--red)">${escHtml(p.error)}</pre>`
        : `<pre class="io">${escHtml(p.response)}</pre>`;
      return `
      <div class="ex">
        <div class="ex-head" role="button" tabindex="0" aria-expanded="false">
          <span class="arrow">&#9654;</span>
          <span class="badge ${engClass}">${escHtml(p.engine)}</span>
          <span class="badge kind">${escHtml(p.kind)}</span>
          <span class="ex-langs">${escHtml(p.src)} &rarr; ${escHtml(p.tgt)}</span>
          ${p.model && p.model !== '-' ? `<span class="ex-meta">${escHtml(p.model)}</span>` : ''}
          <span class="ex-meta">job: ${escHtml(p.job_id)}</span>
          ${errBadge}${retry}
          <span class="ex-spacer"></span>
          <span class="ex-meta">${escHtml(p.prompt_chars)}&rarr;${escHtml(p.response_chars)} ch &middot; ${escHtml(p.duration_ms)} ms</span>
          <span class="ex-time">${escHtml(p.time)}</span>
        </div>
        <div class="ex-body">
          <div class="io-grid">
            <div>
              <div class="io-label">Prompt trimis
                <button class="copy-btn">Copiaza</button>
              </div>
              <pre class="io">${escHtml(p.prompt)}</pre>
            </div>
            <div>
              <div class="io-label">Raspuns primit
                <button class="copy-btn">Copiaza</button>
              </div>
              ${responseBlock}
            </div>
          </div>
        </div>
      </div>`;
    }).join('');
    // Bind data as values, never as executable JavaScript or HTML attributes.
    [...list.querySelectorAll('.ex')].forEach((el, i) => {
      const entry = data.prompts[i], key = String(entry.id);
      el.dataset.exchangeId = key;
      const head = el.querySelector('.ex-head');
      const show = expandedExchanges.has(key);
      el.classList.toggle('open', show);
      head.setAttribute('aria-expanded', String(show));
      const toggle = () => {
        const open = el.classList.toggle('open');
        if (open) expandedExchanges.add(key); else expandedExchanges.delete(key);
        head.setAttribute('aria-expanded', String(open));
      };
      head.addEventListener('click', toggle);
      head.addEventListener('keydown', event => {
        if (event.key === 'Enter' || event.key === ' ') { event.preventDefault(); toggle(); }
      });
      const buttons = el.querySelectorAll('.copy-btn');
      buttons[0].addEventListener('click', () => copyText(buttons[0], entry.prompt || ''));
      buttons[1].addEventListener('click', () => copyText(buttons[1], entry.response || ''));
      const positions = scrollPositions.get(key) || [];
      el.querySelectorAll('pre').forEach((pre, index) => { pre.scrollTop = positions[index] || 0; });
    });
  } catch (e) {
    if (requestId !== promptsRequestId) return;
    $('list').innerHTML = '<div class="empty" style="color:var(--red)">Eroare: ' + escHtml(e.message) + '</div>';
  }
}

async function clearPrompts() {
  if (!confirm('Sigur doriti sa goliti tot istoricul de traduceri?')) return;
  try {
    const resp = await fetch('/api/prompts', { method: 'DELETE' });
    const data = await resp.json();
    if (!resp.ok) throw new Error(data.detail || resp.status);
    expandedExchanges.clear();
    alert(data.cleared + ' intrari sterse');
    loadPrompts();
  } catch (e) {
    alert('Eroare: ' + e.message);
  }
}

let _t = null;
function debouncedLoad() {
  clearTimeout(_t);
  _t = setTimeout(loadPrompts, 350);
}

function toggleTheme() {
  const dark = document.body.getAttribute('data-theme') === 'dark';
  document.body.setAttribute('data-theme', dark ? '' : 'dark');
  localStorage.setItem('theme', dark ? 'light' : 'dark');
}

// Init
if (localStorage.getItem('theme') === 'dark') document.body.setAttribute('data-theme', 'dark');
// Preselect job_id from ?job=... if present
const qp = new URLSearchParams(location.search);
if (qp.get('job')) $('filterJob').value = qp.get('job');
loadPrompts();

setInterval(() => { if ($('autoRefresh').checked) loadPrompts(); }, 5000);
</script>
</body>
</html>
